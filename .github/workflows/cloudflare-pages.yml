name: Deploy ToolKitFree to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkitfree-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'shashank4066/toolkitfree' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_PROJECT: toolkitfree
    steps:
      - name: Check Cloudflare authorization
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find or create the Cloudflare Pages project
        id: pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import re
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          name = os.environ["PAGES_PROJECT"]
          endpoint = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects"
          headers = {
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
              "Content-Type": "application/json",
          }

          def request(url, method, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              with urlopen(Request(url, data=body, headers=headers, method=method), timeout=30) as response:
                  data = json.load(response)
              if not data.get("success"):
                  raise SystemExit("Cloudflare rejected the Pages project request.")
              return data["result"]

          try:
              project = request(f"{endpoint}/{name}", "GET")
          except HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Could not read the Cloudflare Pages project (HTTP {error.code}).") from None
              try:
                  project = request(endpoint, "POST", {"name": name, "production_branch": "main"})
              except HTTPError as error:
                  raise SystemExit(f"Could not create the Cloudflare Pages project (HTTP {error.code}).") from None

          source = (project.get("source") or {}).get("type")
          if source in {"github", "gitlab"}:
              raise SystemExit("The project already uses Git integration. Deploy from that project's connected repository.")
          if project.get("production_branch") != "main":
              raise SystemExit("The existing Pages project has a different production branch.")

          domain = project.get("subdomain", "")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*\.pages\.dev", domain):
              raise SystemExit("Cloudflare returned an invalid Pages hostname.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"site_url=https://{domain}\n")

      - name: Build for the public URL
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.site_url }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Verify the production URL
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}
        shell: python
        run: |
          import os
          import re
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import urlopen

          site = os.environ["SITE_URL"]
          html = Path("dist/index.html").read_text(encoding="utf-8")
          match = re.search(r'src="(/assets/index-[^"]+\.js)"', html)
          if not match:
              raise SystemExit("The built page does not contain its application script.")
          for attempt in range(6):
              try:
                  with urlopen(site + "/?build=" + os.environ["GITHUB_SHA"], timeout=15) as response:
                      if match.group(1) in response.read().decode("utf-8"):
                          break
              except (URLError, TimeoutError):
                  pass
              if attempt < 5:
                  time.sleep(5)
          else:
              raise SystemExit("Cloudflare did not serve the new build at the production URL.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"ToolKitFree is live at [{site}]({site}).\n")
